[project]
name = "veepeak-reader"
version = "0.1.0"
description = "Read OBD-II data from a Veepeak OBDCheck BLE (ELM327) adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.scripts]
veepeak = "veepeak_reader.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
