[project]
name = "obdscope"
version = "0.1.0"
description = "Read your car's data from a Veepeak OBDCheck BLE or other ELM327 Bluetooth adapter: CLI and web dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.14.3",
    "bleak>=0.22",
]

keywords = ["veepeak", "obdcheck", "elm327", "obd2", "obdii", "bluetooth", "ble", "car", "diagnostics", "automotive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
obdscope = "obdscope.cli:main"
veepeak = "obdscope.cli:main"   # the old name, kept as an alias

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
